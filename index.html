<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>3C Scoreboard</title>

<style>

*{
    box-sizing:border-box;
}

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    font-family: Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* MAIN WRAP */
.wrap{
    display:flex;
    gap:30px;
    align-items:center;
    justify-content:center;
    width:100%;
    max-width:100%;
    padding:10px;
}

/* PLAYER CARD */
.card{
    width:360px;
    height:360px;
    display:flex;
    flex-direction:column;
}

/* SCORE AREA */
.score{
    height:270px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:140px;
    font-weight:800;
}

/* AVG */
.avg{
    height:45px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:16px;
    font-weight:700;
}

/* HR ROW */
.hrrow{
    height:45px;
    display:flex;
}

.hrbox{
    width:180px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:15px;
    font-weight:700;

    border-top:1px solid #000;
    border-right:1px solid #000;
}

.hrbox:last-child{
    border-right:none;
}

/* COLORS */
.p1{background:#fff;color:#000;}
.p2{background:#FFD84D;color:#000;}

/* CENTER */
.center{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* LIVE */
.live{
    width:240px;
    height:210px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:100px;
    font-weight:900;
    background:#111;
    border:1px solid #333;
}

/* INNING BOX (UPDATED ONLY VISUAL FIX) */
.inning{
    width:240px;
    height:110px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:#0a0a0a;
    border:2px solid #444;
    margin-top:10px;

    transition:transform 0.15s ease;
}

/* LABEL */
.inning-label{
    font-size:12px;
    font-style:italic;
    color:#fff;
    letter-spacing:1px;
    opacity:0.9;
}

/* VALUE */
.inning-value{
    font-size:60px;
    font-weight:900;
    color:#fff;
}

/* TOUCH */
.live, .inning{
    touch-action: manipulation;
}

</style>
</head>

<body>

<div class="wrap">

    <!-- PLAYER 1 -->
    <div class="card p1">

        <div class="score"><div id="p1">0</div></div>

        <div class="avg">AVG: <span id="avg1">0</span></div>

        <div class="hrrow">
            <div class="hrbox">HR1: <span id="hr1">0</span></div>
            <div class="hrbox">HR2: <span id="hr2p1">0</span></div>
        </div>

    </div>

    <!-- CENTER -->
    <div class="center">

        <div id="live" class="live">0</div>

        <div class="inning" id="inningBox">
    <div class="inning-label-fixed">INNING</div>
    <div id="inning" class="inning-value-fixed">1</div>
</div>

    </div>

    <!-- PLAYER 2 -->
    <div class="card p2">

        <div class="score"><div id="p2">0</div></div>

        <div class="avg">AVG: <span id="avg2">0</span></div>

        <div class="hrrow">
            <div class="hrbox">HR1: <span id="hr1p2">0</span></div>
            <div class="hrbox">HR2: <span id="hr2p2">0</span></div>
        </div>

    </div>

</div>

<script>

let current = 1;

let p1 = 0;
let p2 = 0;

let live = 0;
let inning = 1;

let hrList1 = [];
let hrList2 = [];

function pushTop2(list, val){
    list.push(val);
    list.sort((a,b)=>b-a);
    if(list.length > 2) list.pop();
}

function update(){

    document.getElementById("p1").innerText = p1;
    document.getElementById("p2").innerText = p2;
    document.getElementById("live").innerText = live;
    document.getElementById("inning").innerText = inning;

    document.getElementById("avg1").innerText = (p1 / inning).toFixed(2);
    document.getElementById("avg2").innerText = (p2 / inning).toFixed(2);

    document.getElementById("hr1").innerText = hrList1[0] || 0;
    document.getElementById("hr2p1").innerText = hrList1[1] || 0;

    document.getElementById("hr1p2").innerText = hrList2[0] || 0;
    document.getElementById("hr2p2").innerText = hrList2[1] || 0;

    let liveBox = document.getElementById("live");

    if(current === 1){
        liveBox.style.background = "#fff";
        liveBox.style.color = "#000";
    } else {
        liveBox.style.background = "#FFD84D";
        liveBox.style.color = "#000";
    }

    /* ✔ INNING ANIMATION (SAFE ADDITION) */
    let box = document.getElementById("inningBox");
    box.style.transform = "scale(1.05)";
    setTimeout(()=>box.style.transform="scale(1)",120);
}

/* CONTROLS */
function plus(){ live++; update(); }
function minus(){ live = Math.max(0, live-1); update(); }

function commit(){

    if(current === 1){
        p1 += live;
        pushTop2(hrList1, live);
        current = 2;
    } else {
        p2 += live;
        pushTop2(hrList2, live);
        current = 1;
        inning++;
    }

    live = 0;
    update();
}

/* KEYBOARD */
document.addEventListener("keydown",(e)=>{
    if(e.key==="ArrowUp") plus();
    if(e.key==="ArrowDown") minus();
    if(e.key==="Enter") commit();
});

/* TOUCH */
let pressTimer;
const liveBox = document.getElementById("live");

liveBox.addEventListener("touchstart",()=>{
    pressTimer = setTimeout(()=> minus(), 500);
});

liveBox.addEventListener("touchend",()=>{
    clearTimeout(pressTimer);
    plus();
});

document.querySelector(".inning").addEventListener("touchstart",()=>{
    commit();
});

update();

</script>

</body>
</html>
